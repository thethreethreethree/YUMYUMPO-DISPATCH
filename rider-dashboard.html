<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Driver Dashboard · YUMYUMPO Dispatch</title>
<link rel="icon" type="image/svg+xml" href="./assets/favicon.svg"/>
<link rel="apple-touch-icon" href="./assets/favicon.svg"/>
<meta name="theme-color" content="#FFD000"/>
<meta name="robots" content="noindex,nofollow"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/css/styles.css"/>
<script src="./assets/js/config.js" onerror="window.__noConfig=true"></script>
</head>
<body class="bg-gray-50 text-brand-black font-sans">

<header class="fixed top-0 inset-x-0 z-50 backdrop-blur-xl bg-white/85 border-b border-gray-200">
  <div class="max-w-7xl mx-auto px-4 md:px-8 h-16 flex items-center justify-between">
    <a href="./index.html" class="flex items-center gap-2">
      <span class="w-9 h-9 rounded-2xl bg-brand-yellow text-brand-black grid place-items-center font-display font-black">Y</span>
      <span class="font-display font-bold text-lg">Driver</span>
    </a>
    <div class="flex items-center gap-2 sm:gap-3">
      <select id="status" class="field !w-auto !py-1.5 sm:!py-2 !text-xs sm:!text-sm"></select>
      <div id="notifSlot"></div>
      <div id="sessionSlot"></div>
    </div>
  </div>
</header>

<main class="pt-24 pb-24 max-w-5xl mx-auto px-4 md:px-8">
  <section class="grid md:grid-cols-4 gap-3 mb-8">
    <div class="kpi md:col-span-2">
      <div class="kpi-label">Driver</div>
      <div class="kpi-value" id="riderName"><span class="skeleton" style="width:12ch"></span></div>
      <div class="text-xs text-gray-600 mt-2 font-semibold" id="riderMeta"><span class="skeleton skeleton-text"></span></div>
    </div>
    <div class="kpi"><div class="kpi-label">Completed</div><div class="kpi-value" id="kpiDone"><span class="skeleton skeleton-num"></span></div></div>
    <div class="kpi"><div class="kpi-label">Rating</div><div class="kpi-value" id="kpiRating"><span class="skeleton skeleton-num"></span></div></div>
  </section>

  <section class="mb-10">
    <div class="flex items-end justify-between mb-4">
      <h2 class="font-display text-2xl font-bold">Incoming requests</h2>
      <button id="refreshBtn" class="text-xs font-bold text-yellow-dark hover:underline">Refresh</button>
    </div>
    <div id="incoming" class="space-y-3"></div>
  </section>

  <section>
    <h2 class="font-display text-2xl font-bold mb-4">In progress</h2>
    <div id="inProgress" class="space-y-3"></div>
  </section>

  <section class="mt-10">
    <div class="flex items-end justify-between mb-4">
      <h2 class="font-display text-2xl font-bold">Profile</h2>
      <button id="editProfile" class="btn-ghost !py-2 !px-4 !text-sm">Edit zones & pricing</button>
    </div>
    <div id="profileSummary" class="bg-white rounded-2xl border border-gray-200 p-5 text-sm"></div>
  </section>
</main>

<script type="module">
import { isConfigured, requireAuth } from "./assets/js/auth.js";
import { renderSessionBadge, bindAuthRefresh } from "./assets/js/session-ui.js";
import {
  fetchRider, fetchRequests, acceptRequest, markPickedUp, markDelivered,
  setRiderStatus, updateRiderProfile, uploadAvatar, getZones, enums, trackEvent,
} from "./assets/js/api.js";
import { getUser } from "./assets/js/auth.js";
import { toast, toastError, humanizeError, modal, closeModal, esc, attr } from "./assets/js/components.js";
import { mountNotificationCenter } from "./assets/js/notification-center.js";
import { notifyRequestAccepted, notifyDeliveryCompleted } from "./assets/js/notifications.js";

const sessionSlot = document.getElementById("sessionSlot");

// Auth gate
let me = null, rider = null;
if (isConfigured()) {
  me = await requireAuth("rider");
  if (!me) throw new Error("redirecting");
  rider = await fetchRider(me.profile.id);
  if (!rider) { location.href = "./riders.html?missing=1"; throw new Error("no profile"); }
  // Send unverified drivers back to finish their application.
  if (rider.raw?.verification_status !== "verified") {
    location.href = "./riders.html?missing=1";
    throw new Error("not verified");
  }
} else {
  rider = await fetchRider("r1"); // preview mode
  document.body.insertAdjacentHTML("beforeend",
    `<div class="config-banner">⚠ Preview mode. Add Supabase keys in <code>assets/js/config.js</code> to go live.</div>`);
}
renderSessionBadge(sessionSlot);
bindAuthRefresh(sessionSlot);
mountNotificationCenter(document.getElementById("notifSlot"), { type:"rider", id: rider.id });

// Status selector
const statusSel = document.getElementById("status");
["online","available","busy","offline"].forEach(s => statusSel.insertAdjacentHTML("beforeend", `<option value="${s}" ${rider.status===s?"selected":""}>${s.charAt(0).toUpperCase()+s.slice(1)}</option>`));
statusSel.addEventListener("change", async () => {
  try {
    await setRiderStatus(rider.id, statusSel.value);
    rider.status = statusSel.value;
    toast("Status set to " + statusSel.value);
    trackEvent("status_change", { status: statusSel.value }, { type:"rider", id: rider.id });
    render();
  } catch (e) { toastError(e); }
});

// Profile summary
document.getElementById("riderName").textContent = rider.name || "Driver";
document.getElementById("riderMeta").textContent = `${rider.vehicle || ""} · ${(rider.zones||[]).join(", ") || "no zones set"}`;
document.getElementById("kpiDone").textContent = Number(rider.completed) || 0;
document.getElementById("kpiRating").textContent = Number(rider.rating) ? Number(rider.rating).toFixed(1) : "—";
const baseFee = Number(rider.base_fee) || 0;
const perKm   = Number(rider.per_km_fee) || 0;
function renderProfileSummary() {
  const baseFee = Number(rider.base_fee) || 0;
  const perKm   = Number(rider.per_km_fee) || 0;
  const photo   = /^https?:\/\//.test(rider.photo || "") ? rider.photo : "https://placehold.co/160x160/FFD000/111111?text=Y";
  document.getElementById("profileSummary").innerHTML = `
    <div class="flex items-center gap-5 mb-5">
      <img src="${attr(photo)}" alt="${attr(rider.name || "Driver")}" class="w-20 h-20 rounded-2xl object-cover border border-gray-200" referrerpolicy="no-referrer"/>
      <div class="min-w-0">
        <div class="font-display font-bold text-lg truncate">${esc(rider.name || "Driver")}</div>
        <div class="text-xs text-gray-600 mt-1">${rider.verified ? "<span class='badge badge-verified'>✔ Verified Delivery Partner</span>" : ""}</div>
      </div>
    </div>
    <div class="grid sm:grid-cols-3 gap-4">
      <div><div class="text-xs uppercase tracking-widest font-bold text-gray-600">Vehicle</div><div class="font-display text-xl font-bold capitalize mt-1">${esc(rider.vehicle || "—")}</div></div>
      <div><div class="text-xs uppercase tracking-widest font-bold text-gray-600">Base fee</div><div class="font-display text-xl font-bold mt-1">₱${baseFee}</div></div>
      <div><div class="text-xs uppercase tracking-widest font-bold text-gray-600">Per km</div><div class="font-display text-xl font-bold mt-1">${perKm ? "₱"+perKm : "Flat"}</div></div>
    </div>
    <div class="mt-4 flex flex-wrap gap-2">${(rider.zones||[]).map(z => `<span class="badge badge-zone">${esc(z)}</span>`).join("") || `<span class="text-xs text-gray-600">No zones set yet — add some so restaurants can find you.</span>`}</div>
  `;
}
renderProfileSummary();

// Render queues
function skeletonRows(n = 2) {
  return Array.from({length: n}).map(() => `
    <div class="skeleton-row">
      <span class="skeleton-line"></span>
      <span class="skeleton-line"></span>
      <span class="skeleton-line"></span>
    </div>`).join("");
}

async function render() {
  const incoming = document.getElementById("incoming");
  const inProg   = document.getElementById("inProgress");
  incoming.innerHTML = skeletonRows(2);
  inProg.innerHTML   = "";
  try {
    const hasZones = Array.isArray(rider.zones) && rider.zones.length > 0;
    const isOnline = rider.status === "online" || rider.status === "available";

    const open = hasZones ? await fetchRequests({ openInZones: rider.zones, limit: 30 }) : [];
    const mine = await fetchRequests({ rider_id: rider.id, limit: 30 });
    const active = mine.filter(r => ["Accepted","Picked Up"].includes(r.status));

    let incomingHTML = "";
    if (!hasZones) {
      incomingHTML = `<div class="bg-yellow-light border border-yellow-dark rounded-2xl p-6 text-sm font-semibold">
        You haven't added any delivery zones yet. Restaurants find drivers by zone, so you won't see any requests until you set at least one.
        <button id="addZonesBtn" type="button" class="btn-primary !py-2 !px-4 !text-sm mt-3">Add zones</button>
      </div>`;
    } else if (!isOnline) {
      incomingHTML = `<div class="bg-yellow-pale border border-gray-200 rounded-2xl p-6 text-sm text-gray-600">
        You're currently <b class="capitalize">${esc(rider.status)}</b>. Switch to <b>Online</b> at the top to start seeing requests.
      </div>`;
    } else if (!open.length) {
      incomingHTML = `<div class="bg-white border border-gray-200 rounded-2xl p-6 text-sm text-gray-600">No incoming requests right now. Stay online — restaurants will find you.</div>`;
    } else {
      incomingHTML = open.map(r => requestCard(r, "open")).join("");
    }
    incoming.innerHTML = incomingHTML;

    inProg.innerHTML = active.length ? active.map(r => requestCard(r, "active")).join("")
      : `<div class="bg-white border border-gray-200 rounded-2xl p-6 text-sm text-gray-600">Nothing in progress.</div>`;

    bindActions();
    document.getElementById("addZonesBtn")?.addEventListener("click", () => document.getElementById("editProfile").click());
  } catch (e) { incoming.innerHTML = `<div class="text-sm text-red-600">${esc(humanizeError(e))}</div>`; }
}

function requestCard(r, mode) {
  const created = r.created_at || r.created || "";
  return `
    <div class="rider-card flex items-start justify-between gap-4 flex-wrap" data-id="${attr(r.id)}">
      <div class="min-w-0">
        <div class="text-xs uppercase tracking-widest text-gray-600 font-bold">${esc(r.zone)}</div>
        <div class="font-display text-lg font-bold mt-1">${esc(r.pickup)} → ${esc(r.dropoff)}</div>
        <div class="text-xs text-gray-600 mt-1">${esc(formatTime(created))}${r.notes ? " · " + esc(r.notes) : ""}</div>
      </div>
      <div class="flex gap-2">
        ${mode === "open" ? `<button class="btn-ghost decline" data-id="${attr(r.id)}" type="button">Skip</button><button class="btn-primary accept" data-id="${attr(r.id)}" type="button">Accept</button>`
          : r.status === "Accepted" ? `<button class="btn-primary pickup" data-id="${attr(r.id)}" type="button">Picked up</button>`
          : `<button class="btn-primary deliver" data-id="${attr(r.id)}" type="button">Delivered</button>`}
      </div>
    </div>`;
}
function formatTime(t){ try { return new Date(t).toLocaleString(); } catch { return String(t); } }

function bindActions() {
  document.querySelectorAll(".accept").forEach(b => b.addEventListener("click", async () => {
    b.disabled = true;
    try {
      const req = await acceptRequest(b.dataset.id, rider.id);
      if (!req) {
        toast("Another driver got there first");
        render();
        return;
      }
      await notifyRequestAccepted(req, req.restaurant_id, rider.name);
      toast("Accepted — restaurant will reach you on WhatsApp");
      render();
    } catch (e) {
      toastError(e);
      b.disabled = false;
    }
  }));
  document.querySelectorAll(".decline").forEach(b => b.addEventListener("click", () => {
    b.closest(".rider-card").remove();
  }));
  document.querySelectorAll(".pickup").forEach(b => b.addEventListener("click", async () => {
    try { await markPickedUp(b.dataset.id); toast("Marked as picked up"); render(); } catch(e){ toastError(e); }
  }));
  document.querySelectorAll(".deliver").forEach(b => b.addEventListener("click", async () => {
    try {
      const req = await markDelivered(b.dataset.id);
      await notifyDeliveryCompleted(req, req.restaurant_id, rider.name);
      toast("Delivery completed");
      rider = await fetchRider(rider.id); // refresh counters
      document.getElementById("kpiDone").textContent = rider.completed;
      render();
    } catch(e){ toastError(e); }
  }));
}

document.getElementById("refreshBtn").addEventListener("click", render);

// Edit profile modal
document.getElementById("editProfile").addEventListener("click", async () => {
  const zones = await getZones();
  const currentPhoto = /^https?:\/\//.test(rider.photo || "") ? rider.photo : "https://placehold.co/160x160/FFD000/111111?text=Y";
  modal(`
    <div class="text-xs uppercase tracking-widest font-bold text-yellow-dark mb-2">Edit profile</div>
    <h2 class="font-display text-2xl font-bold mb-4">Photo, zones & pricing</h2>
    <form id="profForm" class="space-y-4" novalidate>
      <div class="flex items-center gap-4">
        <img id="avatarPreview" src="${attr(currentPhoto)}" alt="${attr(rider.name||"")}" class="w-16 h-16 rounded-2xl object-cover border border-gray-200" referrerpolicy="no-referrer"/>
        <label class="upload !flex-1 !cursor-pointer">
          <span>Change profile photo (optional)</span>
          <input id="avatarFile" type="file" name="avatar" accept="image/jpeg,image/png,image/webp"/>
        </label>
      </div>
      <div>
        <label class="text-xs font-bold text-gray-600">Vehicle</label>
        <select class="field mt-1" name="vehicle_type">${enums.VEHICLES.map(v => `<option value="${attr(v)}" ${rider.vehicle===v?"selected":""}>${esc(v)}</option>`).join("")}</select>
      </div>
      <div>
        <label class="text-xs font-bold text-gray-600">Zones (pick all that apply)</label>
        <div id="zoneChips" class="flex flex-wrap gap-2 mt-2">${zones.map(z => `<button type="button" class="zone-chip ${rider.zones.includes(z)?"on":""}" data-zone="${attr(z)}">${esc(z)}</button>`).join("")}</div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="text-xs font-bold text-gray-600">Base fee (₱)</label><input class="field mt-1" type="number" name="base_fee" min="0" step="1" value="${attr(Number(rider.base_fee)||0)}"/></div>
        <div><label class="text-xs font-bold text-gray-600">Per km (₱)</label><input class="field mt-1" type="number" name="per_km_fee" min="0" step="1" value="${attr(Number(rider.per_km_fee)||0)}"/></div>
      </div>
      <div id="profErr" class="text-sm text-red-600 font-semibold hidden"></div>
      <div class="flex justify-end gap-2 pt-2">
        <button type="button" class="btn-ghost" id="profCancel">Cancel</button>
        <button class="btn-primary" id="profSave" type="submit">Save</button>
      </div>
    </form>
  `);

  // Live preview when the user picks an image
  const avatarFile = document.getElementById("avatarFile");
  const avatarPreview = document.getElementById("avatarPreview");
  avatarFile.addEventListener("change", () => {
    const f = avatarFile.files?.[0];
    if (!f) return;
    if (f.size > 5 * 1024 * 1024) { toast("Photo must be 5 MB or smaller"); avatarFile.value = ""; return; }
    avatarPreview.src = URL.createObjectURL(f);
  });
  const chosen = new Set(rider.zones);
  document.querySelectorAll("#zoneChips .zone-chip").forEach(c => c.addEventListener("click", () => {
    c.classList.toggle("on");
    const v = c.dataset.zone;
    if (chosen.has(v)) chosen.delete(v); else chosen.add(v);
  }));
  document.getElementById("profCancel").addEventListener("click", closeModal);
  document.getElementById("profForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errEl = document.getElementById("profErr");
    errEl.classList.add("hidden");
    const btn = document.getElementById("profSave");
    const orig = btn.textContent;
    btn.disabled = true;
    const f = new FormData(e.target);
    try {
      const patch = {
        vehicle_type: f.get("vehicle_type"),
        delivery_zones: [...chosen],
        base_fee: Number(f.get("base_fee")),
        per_km_fee: Number(f.get("per_km_fee")),
      };

      // Upload the avatar first if the user picked one. Public URL goes into
      // the same patch so the profile update is a single round-trip.
      const avatar = f.get("avatar");
      if (avatar && avatar.size) {
        btn.textContent = "Uploading photo…";
        const user = await getUser();
        if (!user) throw new Error("Sign in expired. Please sign in again.");
        const publicUrl = await uploadAvatar(user.id, avatar);
        if (publicUrl) patch.profile_photo = publicUrl;
      }

      btn.textContent = "Saving…";
      await updateRiderProfile(rider.id, patch);
      rider = await fetchRider(rider.id);
      closeModal();
      toast("Profile saved");
      renderProfileSummary();
      render();
    } catch (ex) {
      errEl.textContent = humanizeError(ex);
      errEl.classList.remove("hidden");
      btn.disabled = false; btn.textContent = orig;
    }
  });
});

render();
</script>
<script type="module" src="./assets/js/main.js"></script>
</body>
</html>
