<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in · YUMYUMPO Dispatch</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/css/styles.css"/>
<script src="./assets/js/config.js" onerror="console.warn('config.js missing — using offline demo mode')"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: {
      'brand-yellow':'#FFD000','yellow-dark':'#E6BB00','yellow-light':'#FFF9D6','yellow-pale':'#FFFDF0',
      'brand-black':'#111111','black-soft':'#1E1E1E',
      'gray-50':'#F9F9F9','gray-100':'#F3F3F3','gray-200':'#E8E8E8','gray-400':'#ABABAB','gray-600':'#6B6B6B',
      cream:'#FFFFFF', warm:'#F9F9F9', beige:'#FFF9D6', charcoal:'#111111', ink:'#1E1E1E', ember:'#FFD000', dust:'#6B6B6B'
    },
    fontFamily: { display:['"Space Grotesk"','Inter','system-ui','sans-serif'], sans:['Inter','system-ui','sans-serif'] }
  }}};
</script>
</head>
<body class="bg-yellow-pale text-brand-black font-sans min-h-screen grid place-items-center px-5 py-12">

<div class="max-w-md w-full">
  <a href="./index.html" class="flex items-center gap-2.5 mb-10 justify-center">
    <span class="w-10 h-10 rounded-2xl bg-brand-yellow text-brand-black grid place-items-center font-display font-black">Y</span>
    <span class="font-display font-bold text-xl">YUMYUMPO <span class="text-yellow-dark">Dispatch</span></span>
  </a>

  <div id="banner"></div>

  <div class="bg-white rounded-3xl p-8 border border-gray-200 shadow-[0_30px_80px_-40px_rgba(17,17,17,0.25)]">
    <div class="flex items-center gap-2 mb-1">
      <h1 class="font-display text-3xl font-black tracking-tight" id="title">Welcome back</h1>
    </div>
    <p class="text-sm text-gray-600 mt-1" id="subtitle">Sign in to find drivers or get discovered.</p>

    <div class="grid grid-cols-2 gap-2 mt-6">
      <button class="tab active" data-mode="signin">Sign in</button>
      <button class="tab"        data-mode="signup">Create account</button>
    </div>

    <div id="roleRow" class="grid grid-cols-2 gap-2 mt-3 hidden">
      <button class="tab active" data-role="restaurant">I'm a restaurant</button>
      <button class="tab"        data-role="rider">I'm a driver</button>
    </div>

    <form id="authForm" class="mt-6 space-y-3" novalidate>
      <div id="nameRow" class="hidden">
        <label class="text-xs font-bold text-gray-600">Name</label>
        <input class="field mt-1" name="displayName" placeholder="Your name or restaurant name" autocomplete="name"/>
      </div>
      <div id="phoneRow" class="hidden grid sm:grid-cols-2 gap-3">
        <div><label class="text-xs font-bold text-gray-600">Phone</label><input class="field mt-1" name="phone" placeholder="+639XXXXXXXXX" autocomplete="tel"/></div>
        <div><label class="text-xs font-bold text-gray-600">WhatsApp</label><input class="field mt-1" name="whatsapp" placeholder="639XXXXXXXXX"/></div>
      </div>
      <div>
        <label class="text-xs font-bold text-gray-600">Email</label>
        <input class="field mt-1" type="email" name="email" required placeholder="you@example.com" autocomplete="email"/>
      </div>
      <div>
        <label class="text-xs font-bold text-gray-600">Password</label>
        <input class="field mt-1" type="password" name="password" required minlength="8" placeholder="At least 8 characters" autocomplete="current-password"/>
      </div>
      <div id="formError" class="text-sm text-red-600 font-semibold hidden"></div>
      <button class="btn-primary w-full !py-3.5" id="submitBtn">Continue</button>
    </form>

    <div class="relative my-5"><div class="border-t border-gray-200"></div><span class="absolute inset-0 -top-2 text-center text-xs font-bold text-gray-400"><span class="bg-white px-3">or</span></span></div>

    <button id="magicBtn" class="btn-ghost w-full">Email me a magic link</button>

    <div class="text-center text-xs text-gray-600 mt-6">
      Driver? <a href="./riders.html" class="text-yellow-dark font-bold hover:underline">Apply with verification</a>
    </div>
  </div>

  <p class="text-center text-xs text-gray-400 mt-6" id="footerMsg"></p>
</div>

<script type="module">
import { isConfigured, signIn, signUp, signInMagicLink, getSession, getCurrentProfile } from "./assets/js/auth.js";

const params = new URLSearchParams(location.search);
const banner = document.getElementById("banner");
const footerMsg = document.getElementById("footerMsg");

if (!isConfigured()) {
  banner.innerHTML = `<div class="bg-yellow-light border border-yellow-dark text-brand-black rounded-2xl p-4 mb-5 text-sm font-semibold">
    Supabase is not configured. Copy <code>assets/js/config.example.js</code> to <code>assets/js/config.js</code> and add your project keys.
  </div>`;
}
if (params.get("wrong_role") === "1") {
  banner.insertAdjacentHTML("afterbegin", `<div class="bg-red-50 border border-red-200 text-red-700 rounded-2xl p-4 mb-3 text-sm font-semibold">Your account doesn't have access to that page.</div>`);
}
if (params.get("verify") === "1") {
  banner.insertAdjacentHTML("afterbegin", `<div class="bg-yellow-light border border-yellow-dark rounded-2xl p-4 mb-3 text-sm font-semibold">Check your email to confirm your account.</div>`);
}

// If already signed in, route to the right dashboard.
(async () => {
  const session = await getSession();
  if (!session) return;
  const me = await getCurrentProfile();
  const next = params.get("next");
  if (next) return location.href = next;
  if (me?.role === "restaurant") return location.href = "./restaurants.html";
  if (me?.role === "rider")      return location.href = "./rider-dashboard.html";
  if (me?.role === "admin")      return location.href = "./admin.html";
})();

// Mode + role tabs
let mode = "signin", role = "restaurant";
const tabs = document.querySelectorAll("[data-mode]");
const roleTabs = document.querySelectorAll("[data-role]");
const roleRow = document.getElementById("roleRow");
const nameRow = document.getElementById("nameRow");
const phoneRow = document.getElementById("phoneRow");
const title = document.getElementById("title");
const submitBtn = document.getElementById("submitBtn");

function applyMode() {
  tabs.forEach(t => t.classList.toggle("active", t.dataset.mode === mode));
  if (mode === "signin") {
    title.textContent = "Welcome back";
    roleRow.classList.add("hidden");
    nameRow.classList.add("hidden");
    phoneRow.classList.add("hidden");
    submitBtn.textContent = "Sign in";
  } else {
    title.textContent = "Create your account";
    roleRow.classList.remove("hidden");
    nameRow.classList.remove("hidden");
    phoneRow.classList.toggle("hidden", role !== "rider");
    submitBtn.textContent = role === "rider" ? "Create driver account" : "Create restaurant account";
  }
}
tabs.forEach(t => t.addEventListener("click", e => { e.preventDefault(); mode = t.dataset.mode; applyMode(); }));
roleTabs.forEach(t => t.addEventListener("click", e => {
  e.preventDefault();
  role = t.dataset.role;
  roleTabs.forEach(x => x.classList.toggle("active", x.dataset.role === role));
  applyMode();
}));

const err = document.getElementById("formError");
function showError(msg) { err.textContent = msg; err.classList.remove("hidden"); }
function clearError() { err.classList.add("hidden"); }

document.getElementById("authForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  clearError();
  if (!isConfigured()) return showError("Supabase isn't configured yet.");
  const f = new FormData(e.target);
  submitBtn.disabled = true; const origLabel = submitBtn.textContent; submitBtn.textContent = "Working…";
  try {
    if (mode === "signin") {
      await signIn({ email: f.get("email"), password: f.get("password") });
      const me = await getCurrentProfile();
      location.href = params.get("next") || (me?.role === "rider" ? "./rider-dashboard.html"
        : me?.role === "admin" ? "./admin.html" : "./restaurants.html");
    } else {
      if (!f.get("displayName")) throw new Error("Please enter your name.");
      const res = await signUp({
        email: f.get("email"), password: f.get("password"),
        role, displayName: f.get("displayName"),
        phone: f.get("phone"), whatsapp: f.get("whatsapp"),
      });
      if (!res.session) {
        location.href = "./auth.html?verify=1";
        return;
      }
      location.href = role === "rider" ? "./riders.html?verify=1" : "./restaurants.html";
    }
  } catch (ex) {
    showError(ex.message || String(ex));
    submitBtn.disabled = false; submitBtn.textContent = origLabel;
  }
});

document.getElementById("magicBtn").addEventListener("click", async () => {
  clearError();
  if (!isConfigured()) return showError("Supabase isn't configured yet.");
  const email = document.querySelector("input[name=email]").value;
  if (!email) return showError("Enter your email above first.");
  try {
    await signInMagicLink({ email });
    footerMsg.textContent = "Magic link sent. Check your email.";
  } catch (ex) { showError(ex.message); }
});

applyMode();
</script>
</body>
</html>
