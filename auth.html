<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in · YUMYUMPO Dispatch</title>
<link rel="icon" type="image/svg+xml" href="./assets/favicon.svg"/>
<link rel="apple-touch-icon" href="./assets/favicon.svg"/>
<meta name="theme-color" content="#FFD000"/>
<meta name="robots" content="noindex,nofollow"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/css/styles.css"/>
<script src="./assets/js/config.js" onerror="console.warn('config.js missing — using offline demo mode')"></script>
</head>
<body class="bg-yellow-pale text-brand-black font-sans min-h-screen grid place-items-center px-5 py-12">

<div class="max-w-md w-full">
  <a href="./index.html" class="flex items-center gap-2.5 mb-10 justify-center">
    <span class="w-10 h-10 rounded-2xl bg-brand-yellow text-brand-black grid place-items-center font-display font-black">Y</span>
    <span class="font-display font-bold text-xl">YUMYUMPO <span class="text-yellow-dark">Dispatch</span></span>
  </a>

  <div id="banner"></div>

  <div class="bg-white rounded-3xl p-8 border border-gray-200 shadow-[0_30px_80px_-40px_rgba(17,17,17,0.25)]">
    <div class="flex items-center gap-2 mb-1">
      <h1 class="font-display text-3xl font-black tracking-tight" id="title">Welcome back</h1>
    </div>
    <p class="text-sm text-gray-600 mt-1" id="subtitle">Sign in to find drivers or get discovered.</p>

    <div class="grid grid-cols-2 gap-2 mt-6">
      <button class="tab active" data-mode="signin">Sign in</button>
      <button class="tab"        data-mode="signup">Create account</button>
    </div>

    <div id="roleRow" class="grid grid-cols-2 gap-2 mt-3 hidden">
      <button class="tab active" data-role="restaurant">I'm a restaurant</button>
      <button class="tab"        data-role="rider">I'm a driver</button>
    </div>

    <form id="authForm" class="mt-6 space-y-3" novalidate>
      <div id="nameRow" class="hidden">
        <label class="text-xs font-bold text-gray-600">Name</label>
        <input class="field mt-1" name="displayName" placeholder="Your name or restaurant name" autocomplete="name"/>
      </div>
      <div id="phoneRow" class="hidden grid sm:grid-cols-2 gap-3">
        <div><label class="text-xs font-bold text-gray-600">Phone</label><input class="field mt-1" name="phone" placeholder="+639XXXXXXXXX" autocomplete="tel"/></div>
        <div><label class="text-xs font-bold text-gray-600">WhatsApp</label><input class="field mt-1" name="whatsapp" placeholder="639XXXXXXXXX"/></div>
      </div>
      <div id="emailRow">
        <label class="text-xs font-bold text-gray-600">Email</label>
        <input class="field mt-1" type="email" name="email" required placeholder="you@example.com" autocomplete="email"/>
      </div>
      <div id="passwordRow">
        <div class="flex items-center justify-between">
          <label class="text-xs font-bold text-gray-600">Password</label>
          <button type="button" id="forgotLink" class="text-xs font-bold text-yellow-dark hover:underline">Forgot password?</button>
        </div>
        <input class="field mt-1" type="password" name="password" required minlength="8" placeholder="At least 8 characters" autocomplete="current-password"/>
      </div>
      <div id="newPasswordRow" class="hidden space-y-3">
        <div>
          <label class="text-xs font-bold text-gray-600">New password</label>
          <input class="field mt-1" type="password" name="newPassword" minlength="8" placeholder="At least 8 characters" autocomplete="new-password"/>
        </div>
        <div>
          <label class="text-xs font-bold text-gray-600">Confirm new password</label>
          <input class="field mt-1" type="password" name="confirmPassword" minlength="8" autocomplete="new-password"/>
        </div>
      </div>
      <div id="formError" class="text-sm text-red-600 font-semibold hidden"></div>
      <div id="formInfo"  class="text-sm text-yellow-dark font-semibold hidden"></div>
      <button class="btn-primary w-full !py-3.5" id="submitBtn">Continue</button>
      <button type="button" id="backToSignin" class="text-xs font-bold text-gray-600 hover:text-brand-black hidden w-full text-center mt-2">← Back to sign in</button>
    </form>

    <div id="altMethods">
      <div class="relative my-5"><div class="border-t border-gray-200"></div><span class="absolute inset-0 -top-2 text-center text-xs font-bold text-gray-400"><span class="bg-white px-3">or</span></span></div>
      <button id="magicBtn" type="button" class="btn-ghost w-full">Email me a magic link</button>
    </div>

    <div class="text-center text-xs text-gray-600 mt-6">
      Driver? <a href="./riders.html" class="text-yellow-dark font-bold hover:underline">Apply with verification</a>
    </div>
  </div>

  <p class="text-center text-xs text-gray-400 mt-6" id="footerMsg"></p>
</div>

<script type="module">
import { isConfigured, signIn, signUp, signInMagicLink, sendPasswordReset, updatePassword, getSession, getCurrentProfile, onAuthChange } from "./assets/js/auth.js";
import { humanizeError } from "./assets/js/components.js";

const params = new URLSearchParams(location.search);
const banner = document.getElementById("banner");
const footerMsg = document.getElementById("footerMsg");

if (!isConfigured()) {
  banner.innerHTML = `<div class="bg-yellow-light border border-yellow-dark text-brand-black rounded-2xl p-4 mb-5 text-sm font-semibold">
    Supabase is not configured. Copy <code>assets/js/config.example.js</code> to <code>assets/js/config.js</code> and add your project keys.
  </div>`;
}
if (params.get("wrong_role") === "1") {
  banner.insertAdjacentHTML("afterbegin", `<div class="bg-red-50 border border-red-200 text-red-700 rounded-2xl p-4 mb-3 text-sm font-semibold">Your account doesn't have access to that page.</div>`);
}
if (params.get("verify") === "1") {
  banner.insertAdjacentHTML("afterbegin", `<div class="bg-yellow-light border border-yellow-dark rounded-2xl p-4 mb-3 text-sm font-semibold">Check your email to confirm your account.</div>`);
}

// Mode: signin | signup | forgot | recovery
let mode = "signin", role = "restaurant";
// Recovery mode is special: the user landed here from a password-reset email;
// supabase-js parses the recovery token from the URL hash automatically and
// fires the `PASSWORD_RECOVERY` event. We then show the "set new password"
// form and SUPPRESS the usual auto-redirect to a dashboard.
let inRecovery = false;
const url = new URL(location.href);
const urlHasRecoveryToken = url.hash.includes("type=recovery") || url.searchParams.get("type") === "recovery";

const tabs       = document.querySelectorAll("[data-mode]");
const roleTabs   = document.querySelectorAll("[data-role]");
const roleRow    = document.getElementById("roleRow");
const nameRow    = document.getElementById("nameRow");
const phoneRow   = document.getElementById("phoneRow");
const emailRow   = document.getElementById("emailRow");
const passwordRow    = document.getElementById("passwordRow");
const newPasswordRow = document.getElementById("newPasswordRow");
const altMethods     = document.getElementById("altMethods");
const backToSigninBtn = document.getElementById("backToSignin");
const forgotLink     = document.getElementById("forgotLink");
const title    = document.getElementById("title");
const subtitle = document.getElementById("subtitle");
const submitBtn = document.getElementById("submitBtn");
const form     = document.getElementById("authForm");
const err  = document.getElementById("formError");
const info = document.getElementById("formInfo");
function showError(msg) { err.textContent = msg; err.classList.remove("hidden"); info.classList.add("hidden"); }
function showInfo(msg)  { info.textContent = msg; info.classList.remove("hidden"); err.classList.add("hidden"); }
function clearMsg()     { err.classList.add("hidden"); info.classList.add("hidden"); }

function applyMode() {
  clearMsg();
  // Reset visibility — start from a clean slate every call.
  emailRow.classList.remove("hidden");
  passwordRow.classList.remove("hidden");
  newPasswordRow.classList.add("hidden");
  roleRow.classList.add("hidden");
  nameRow.classList.add("hidden");
  phoneRow.classList.add("hidden");
  altMethods.classList.add("hidden");
  backToSigninBtn.classList.add("hidden");
  forgotLink.classList.add("hidden");
  tabs.forEach(t => t.parentElement.classList.remove("hidden"));

  if (mode === "signin") {
    tabs.forEach(t => t.classList.toggle("active", t.dataset.mode === "signin"));
    title.textContent = "Welcome back";
    subtitle.textContent = "Sign in to find drivers or get discovered.";
    submitBtn.textContent = "Sign in";
    forgotLink.classList.remove("hidden");
    altMethods.classList.remove("hidden");
  } else if (mode === "signup") {
    tabs.forEach(t => t.classList.toggle("active", t.dataset.mode === "signup"));
    title.textContent = "Create your account";
    subtitle.textContent = "Tell us a bit about yourself to get started.";
    roleRow.classList.remove("hidden");
    nameRow.classList.remove("hidden");
    phoneRow.classList.toggle("hidden", role !== "rider");
    submitBtn.textContent = role === "rider" ? "Create driver account" : "Create restaurant account";
  } else if (mode === "forgot") {
    tabs.forEach(t => t.parentElement.classList.add("hidden"));
    title.textContent = "Reset your password";
    subtitle.textContent = "We'll email you a secure link to set a new password.";
    passwordRow.classList.add("hidden");
    submitBtn.textContent = "Send reset link";
    backToSigninBtn.classList.remove("hidden");
  } else if (mode === "recovery") {
    tabs.forEach(t => t.parentElement.classList.add("hidden"));
    title.textContent = "Set a new password";
    subtitle.textContent = "Pick a new password. You'll be signed in after.";
    emailRow.classList.add("hidden");
    passwordRow.classList.add("hidden");
    newPasswordRow.classList.remove("hidden");
    submitBtn.textContent = "Save new password";
  }
}

tabs.forEach(t => t.addEventListener("click", e => { e.preventDefault(); mode = t.dataset.mode; applyMode(); }));
roleTabs.forEach(t => t.addEventListener("click", e => {
  e.preventDefault();
  role = t.dataset.role;
  roleTabs.forEach(x => x.classList.toggle("active", x.dataset.role === role));
  applyMode();
}));
forgotLink.addEventListener("click", () => { mode = "forgot"; applyMode(); });
backToSigninBtn.addEventListener("click", () => { mode = "signin"; applyMode(); });

// Listen for the recovery event from supabase-js. This fires when the user
// clicks the link in the reset email and the JS client picks up the hash token.
if (isConfigured()) {
  onAuthChange((session, event) => {
    if (event === "PASSWORD_RECOVERY") {
      inRecovery = true;
      mode = "recovery";
      applyMode();
      // Strip the recovery hash so a refresh doesn't re-trigger it.
      history.replaceState(null, "", location.pathname + "?reset=1");
    }
  });
}

// Initial routing decision.
(async () => {
  // If we landed from the reset email — token in hash OR ?reset=1 marker —
  // stay in recovery mode and don't redirect to a dashboard, even on refresh.
  if (urlHasRecoveryToken || params.get("reset") === "1") {
    inRecovery = true;
    mode = "recovery";
    applyMode();
    showInfo("Choose a new password below.");
    return;
  }

  applyMode();

  const session = isConfigured() ? await getSession() : null;
  if (!session || inRecovery) return;

  const me = await getCurrentProfile();
  const next = params.get("next");
  if (next) return location.href = next;
  if (me?.role === "admin")      return location.href = "./admin.html";
  if (me?.role === "restaurant") return location.href = "./restaurants.html";
  if (me?.role === "rider") {
    if (me.profile?.verification_status !== "verified") {
      return location.href = "./riders.html?confirmed=1";
    }
    return location.href = "./rider-dashboard.html";
  }
})();

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  clearMsg();
  if (!isConfigured()) return showError("Supabase isn't configured yet.");
  const f = new FormData(e.target);
  submitBtn.disabled = true; const origLabel = submitBtn.textContent; submitBtn.textContent = "Working…";
  try {
    if (mode === "signin") {
      await signIn({ email: f.get("email"), password: f.get("password") });
      const me = await getCurrentProfile();
      const next = params.get("next");
      if (next) { location.href = next; return; }
      if (me?.role === "admin")      { location.href = "./admin.html"; return; }
      if (me?.role === "restaurant") { location.href = "./restaurants.html"; return; }
      if (me?.role === "rider") {
        location.href = me.profile?.verification_status === "verified"
          ? "./rider-dashboard.html"
          : "./riders.html?confirmed=1";
        return;
      }
      location.href = "./index.html";
    } else if (mode === "signup") {
      if (!f.get("displayName")) throw new Error("Please enter your name.");
      const res = await signUp({
        email: f.get("email"), password: f.get("password"),
        role, displayName: f.get("displayName"),
        phone: f.get("phone"), whatsapp: f.get("whatsapp"),
      });
      if (!res.session) {
        location.href = "./auth.html?verify=1";
        return;
      }
      location.href = role === "rider" ? "./riders.html?verify=1" : "./restaurants.html";
    } else if (mode === "forgot") {
      const email = (f.get("email") || "").toString().trim();
      if (!email) throw new Error("Enter the email on your account.");
      await sendPasswordReset(email);
      showInfo("Reset link sent. Check your email and follow the link to set a new password.");
      submitBtn.disabled = true; submitBtn.textContent = "Sent ✓";
      return;
    } else if (mode === "recovery") {
      const pw = (f.get("newPassword") || "").toString();
      const confirm = (f.get("confirmPassword") || "").toString();
      if (pw.length < 8) throw new Error("Password must be at least 8 characters.");
      if (pw !== confirm) throw new Error("Passwords don't match.");
      await updatePassword(pw);
      showInfo("Password updated. Redirecting to your dashboard…");
      const me = await getCurrentProfile();
      setTimeout(() => {
        if (me?.role === "admin")      location.href = "./admin.html";
        else if (me?.role === "rider") {
          location.href = me.profile?.verification_status === "verified"
            ? "./rider-dashboard.html" : "./riders.html?confirmed=1";
        } else if (me?.role === "restaurant") location.href = "./restaurants.html";
        else location.href = "./index.html";
      }, 1200);
      return;
    }
  } catch (ex) {
    showError(humanizeError(ex));
    submitBtn.disabled = false; submitBtn.textContent = origLabel;
  }
});

document.getElementById("magicBtn").addEventListener("click", async () => {
  clearMsg();
  if (!isConfigured()) return showError("Supabase isn't configured yet.");
  const email = document.querySelector("input[name=email]").value;
  if (!email) return showError("Enter your email above first.");
  try {
    await signInMagicLink({ email });
    showInfo("Magic link sent. Check your email.");
  } catch (ex) { showError(humanizeError(ex)); }
});
</script>
<script type="module" src="./assets/js/main.js"></script>
</body>
</html>
