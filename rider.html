<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Driver Profile · YUMYUMPO Dispatch</title>
<link rel="icon" type="image/svg+xml" href="./assets/favicon.svg"/>
<link rel="apple-touch-icon" href="./assets/favicon.svg"/>
<link rel="manifest" href="./manifest.webmanifest"/>
<meta name="theme-color" content="#FFD000"/>
<meta property="og:site_name" content="YUMYUMPO Dispatch"/>
<meta property="og:type" content="profile"/>
<meta property="og:title" content="Driver Profile · YUMYUMPO Dispatch"/>
<meta property="og:description" content="A verified independent delivery driver on the YUMYUMPO Dispatch network."/>
<meta property="og:image" content="./assets/og-image.svg"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:image" content="./assets/og-image.svg"/>
<script src="./assets/js/config.js" onerror="window.__noConfig=true"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/css/styles.css"/>
</head>
<body class="bg-cream text-charcoal font-sans">

<header class="fixed top-0 inset-x-0 z-50 backdrop-blur-xl bg-white/85 border-b border-gray-200">
  <div class="max-w-7xl mx-auto px-5 md:px-8 h-16 flex items-center justify-between">
    <a href="./index.html" class="flex items-center gap-2">
      <span class="w-9 h-9 rounded-2xl bg-brand-yellow text-brand-black grid place-items-center font-display font-black">Y</span>
      <span class="font-display font-bold text-lg">YUMYUMPO <span class="text-yellow-dark">Dispatch</span></span>
    </a>
    <div class="flex items-center gap-3">
      <a href="./marketplace.html" class="hidden md:inline-flex text-sm font-semibold text-gray-600 hover:text-brand-black">← All drivers</a>
      <button type="button" class="menu-trigger" data-drawer-target="#mobileNav" aria-label="Open menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
  </div>
</header>

<aside id="mobileNav" class="drawer-panel" aria-label="Site menu">
  <div class="drawer-head">
    <div class="flex items-center gap-2"><span class="w-9 h-9 rounded-2xl bg-brand-yellow text-brand-black grid place-items-center font-display font-black">Y</span><span class="font-display font-bold">Dispatch</span></div>
    <button type="button" class="drawer-close" data-drawer-close aria-label="Close menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg></button>
  </div>
  <nav class="drawer-body">
    <a href="./index.html" class="drawer-link">🏠 Home</a>
    <a href="./marketplace.html" class="drawer-link">🛵 All drivers</a>
    <a href="./restaurants.html" class="drawer-link">🏪 Restaurants</a>
    <a href="./about.html" class="drawer-link">💛 About</a>
    <a href="./auth.html" class="drawer-link">Sign in</a>
  </nav>
</aside>

<main id="profile" class="pt-28 pb-20 max-w-5xl mx-auto px-5 md:px-8"></main>

<script type="module">
import { fetchRider, togglePreferred, fetchPreferredRiderIds, getRestaurantByUser } from "./assets/js/api.js";
import { getUser } from "./assets/js/auth.js";
import { toast, toastError, esc, attr, safeImg, safePhone, num } from "./assets/js/components.js";

const id = new URLSearchParams(location.search).get("id");
if (!id) { location.href = "./marketplace.html"; throw new Error("no id"); }
const r = await fetchRider(id);

let viewerRestaurantId = null;
try { const u = await getUser(); if (u) { const rs = await getRestaurantByUser(u.id); viewerRestaurantId = rs?.id || null; } } catch {}
if (!r) {
  document.getElementById("profile").innerHTML = `<div class="text-center py-20"><div class="font-display text-3xl font-bold">Driver not found</div><a href="./marketplace.html" class="btn-primary mt-6">Back to marketplace</a></div>`;
  throw new Error("not found");
}
const pref = viewerRestaurantId ? (await fetchPreferredRiderIds(viewerRestaurantId)).includes(r.id) : false;
const rating = num(r.rating, 0);
const rounded = Math.round(rating);
const stars = "★".repeat(rounded) + "☆".repeat(Math.max(0, 5 - rounded));
const photo = safeImg(r.photo, "https://placehold.co/600x600/FFD000/111111?text=Driver");
const phone = safePhone(r.phone);
const wa    = safePhone(r.whatsapp);
const firstName = String(r.name || "Driver").split(" ")[0];
const statusClass = ["online","available","busy","offline"].includes(r.status) ? r.status : "offline";

document.getElementById("profile").innerHTML = `
  <div class="grid lg:grid-cols-3 gap-8">
    <aside class="lg:col-span-1">
      <div class="rounded-3xl overflow-hidden border border-gray-200">
        <img src="${photo}" alt="${attr(r.name)}" class="w-full aspect-square object-cover" referrerpolicy="no-referrer"/>
      </div>
      <div class="mt-6 flex flex-col gap-2">
        ${wa ? `<a href="https://wa.me/${attr(wa)}" target="_blank" rel="noopener noreferrer" class="btn-primary w-full">WhatsApp ${esc(firstName)}</a>` : ""}
        ${phone ? `<a href="tel:${attr(phone)}" class="btn-ghost w-full">Call ${esc(phone)}</a>` : ""}
        <button id="favBtn" type="button" class="btn-ghost w-full">${pref ? "★ Preferred" : "☆ Save as preferred"}</button>
      </div>
    </aside>

    <section class="lg:col-span-2">
      <div class="text-xs uppercase tracking-widest text-yellow-dark font-bold mb-2">Delivery Partner</div>
      <h1 class="font-display text-4xl md:text-5xl font-black tracking-tight">${esc(r.name)}</h1>
      <div class="mt-2 text-gray-600 flex items-center gap-3 flex-wrap">
        <span class="status-dot status-${statusClass}"></span>
        <span class="capitalize">${esc(r.status)}</span>
        <span>·</span>
        <span class="capitalize">${esc(r.vehicle)}</span>
        ${r.verified ? '<span>·</span><span class="badge badge-verified">✔ Verified Delivery Partner</span>' : ""}
      </div>

      <div class="mt-8 grid grid-cols-3 gap-3">
        <div class="kpi"><div class="kpi-label">Rating</div><div class="kpi-value">${rating.toFixed(1)}<span class="text-base text-yellow-dark"> ${stars}</span></div></div>
        <div class="kpi"><div class="kpi-label">Deliveries</div><div class="kpi-value">${num(r.completed, 0)}</div></div>
        <div class="kpi"><div class="kpi-label">Preferred by</div><div class="kpi-value">${num(r.preferred_count, 0)}</div></div>
      </div>

      <div class="mt-8">
        <div class="text-xs uppercase tracking-widest text-gray-400 font-bold mb-3">Delivery zones</div>
        <div class="flex flex-wrap gap-2">${(Array.isArray(r.zones) ? r.zones : []).map(z => `<span class="badge badge-zone">${esc(z)}</span>`).join("")}</div>
      </div>

      <div class="mt-8 grid sm:grid-cols-2 gap-3">
        <div class="bg-white rounded-2xl border border-gray-200 p-5">
          <div class="text-xs uppercase tracking-widest text-gray-400 font-bold">Base fee</div>
          <div class="font-display text-3xl font-bold mt-1">₱${num(r.base_fee, 0)}</div>
        </div>
        <div class="bg-white rounded-2xl border border-gray-200 p-5">
          <div class="text-xs uppercase tracking-widest text-gray-400 font-bold">Per kilometer</div>
          <div class="font-display text-3xl font-bold mt-1">${num(r.per_km_fee, 0) ? "₱"+num(r.per_km_fee, 0) : "Flat"}</div>
        </div>
      </div>

      <div class="mt-10 p-5 rounded-2xl bg-warm border border-charcoal/5 text-sm text-charcoal/70 leading-relaxed">
        Reach out directly. Tap WhatsApp or Call to introduce yourself, share pickup details, and confirm timing. We just help you find each other — the rest is yours.
      </div>
    </section>
  </div>
`;

document.getElementById("favBtn").addEventListener("click", async () => {
  if (!viewerRestaurantId) { location.href = "./auth.html?next=" + encodeURIComponent(location.pathname + location.search); return; }
  try {
    const list = await togglePreferred(viewerRestaurantId, r.id);
    toast(list.includes(r.id) ? "Saved as preferred" : "Removed");
    setTimeout(() => location.reload(), 600);
  } catch (e) { toastError(e); }
});
</script>
<script type="module" src="./assets/js/main.js"></script>
</body>
</html>
